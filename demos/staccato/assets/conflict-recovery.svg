<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0a0f"/><text x="65" y="75" fill="#e4e4e7" font-size="44" font-family="Noto Sans, sans-serif">Stop at a conflict. Resume the stack.</text><rect x="65" y="145" width="1010" height="615" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="90" y="188" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">Conflict → edit api.go → stage → continue</text><text x="90" y="239" fill="#818cf8" font-size="28" font-family="Fira Code, monospace">$ st modify --all</text><text x="90" y="287" fill="#e4e4e7" font-size="28" font-family="Fira Code, monospace">⚠ Conflict while rebasing &#x27;feature/validation&#x27;</text><text x="90" y="335" fill="#e4e4e7" font-size="28" font-family="Fira Code, monospace">  Please resolve the conflicts and run &#x27;st continue&#x27;</text><text x="90" y="407" fill="#818cf8" font-size="28" font-family="Fira Code, monospace">$ git add api.go</text><text x="90" y="479" fill="#818cf8" font-size="28" font-family="Fira Code, monospace">$ st continue</text><text x="90" y="527" fill="#e4e4e7" font-size="28" font-family="Fira Code, monospace">✔ Restacked 2 branch(es)</text><rect x="1120" y="145" width="415" height="615" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="1150" y="205" fill="#fcd34d" font-size="30" font-family="Noto Sans, sans-serif">Need to back out?</text><text x="1150" y="290" fill="#818cf8" font-size="35" font-family="Fira Code, monospace">st abort</text><text x="1150" y="365" fill="#e4e4e7" font-size="27" font-family="Noto Sans, sans-serif">Restores branches</text><text x="1150" y="418" fill="#e4e4e7" font-size="27" font-family="Noto Sans, sans-serif">from the backups</text><text x="1150" y="471" fill="#e4e4e7" font-size="27" font-family="Noto Sans, sans-serif">for the operation.</text><text x="1150" y="524" fill="#e4e4e7" font-size="27" font-family="Noto Sans, sans-serif"></text><text x="1150" y="577" fill="#e4e4e7" font-size="27" font-family="Noto Sans, sans-serif">Rebases still need</text><text x="1150" y="630" fill="#e4e4e7" font-size="27" font-family="Noto Sans, sans-serif">conflict resolution.</text><text x="65" y="830" fill="#a1a1aa" font-size="29" font-family="Noto Sans, sans-serif">Resolve the files yourself—or use an agent—then stage and continue.</text></svg>
