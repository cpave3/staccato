<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0a0f"/><text x="70" y="80" fill="#e4e4e7" font-size="46" font-family="Noto Sans, sans-serif">One feature. Smaller review boundaries.</text><text x="70" y="135" fill="#a1a1aa" font-size="30" font-family="Noto Sans, sans-serif">Keep building while the lower changes are under review.</text><rect x="70" y="200" width="650" height="565" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="105" y="265" fill="#fcd34d" font-size="37" font-family="Noto Sans, sans-serif">One large PR</text><text x="105" y="350" fill="#e4e4e7" font-size="35" font-family="Noto Sans, sans-serif">API + validation + UI</text><text x="105" y="425" fill="#e4e4e7" font-size="35" font-family="Noto Sans, sans-serif">One large diff</text><text x="105" y="500" fill="#e4e4e7" font-size="35" font-family="Noto Sans, sans-serif">One review queue</text><text x="105" y="575" fill="#e4e4e7" font-size="35" font-family="Noto Sans, sans-serif">One merge boundary</text><text x="885" y="250" fill="#34d399" font-size="37" font-family="Noto Sans, sans-serif">A stack of small PRs</text><rect x="875" y="295" width="650" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="900" y="340" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">API</text><text x="900" y="379" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">Base: trunk</text><path d="M1200 410 L1200 450" stroke="#818cf8" stroke-width="4" fill="none"/><path d="M1192 438 L1200 450 L1208 438" stroke="#818cf8" stroke-width="4" fill="none"/><rect x="875" y="450" width="650" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="900" y="495" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">Validation</text><text x="900" y="534" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">Base: API</text><path d="M1200 565 L1200 605" stroke="#818cf8" stroke-width="4" fill="none"/><path d="M1192 593 L1200 605 L1208 593" stroke="#818cf8" stroke-width="4" fill="none"/><rect x="875" y="605" width="650" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="900" y="650" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">UI</text><text x="900" y="689" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">Base: validation</text><text x="70" y="840" fill="#818cf8" font-size="30" font-family="Noto Sans, sans-serif">Staccato records the dependencies; you keep using ordinary Git commits.</text></svg>
