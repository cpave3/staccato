<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0a0f"/><text x="100" y="180" fill="#818cf8" font-size="30" font-family="Noto Sans, sans-serif">TRY ONE FEATURE</text><text x="100" y="285" fill="#e4e4e7" font-size="60" font-family="Noto Sans, sans-serif">Smaller PRs. Less housekeeping.</text><text x="100" y="390" fill="#a1a1aa" font-size="43" font-family="Noto Sans, sans-serif">new → append → modify → sync</text><text x="100" y="525" fill="#e4e4e7" font-size="31" font-family="Noto Sans, sans-serif">• Two or three dependent PRs</text><text x="100" y="625" fill="#e4e4e7" font-size="31" font-family="Noto Sans, sans-serif">• Ordinary Git commits; Staccato handles the stack</text><text x="100" y="725" fill="#e4e4e7" font-size="31" font-family="Noto Sans, sans-serif">• Existing branch? st attach &lt;branch&gt; --parent &lt;parent&gt;</text></svg>
