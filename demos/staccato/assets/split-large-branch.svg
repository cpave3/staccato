<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0a0f"/><text x="55" y="70" fill="#e4e4e7" font-size="43" font-family="Noto Sans, sans-serif">From one big branch to reviewable slices.</text><rect x="55" y="125" width="445" height="675" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="80" y="175" fill="#818cf8" font-size="29" font-family="Noto Sans, sans-serif">1. Describe + choose seams</text><text x="80" y="235" fill="#818cf8" font-size="25" font-family="Fira Code, monospace">$ st split describe</text><text x="80" y="295" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">Inventory highlights</text><text x="80" y="341" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">feature/orders → main</text><text x="80" y="387" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">api.go + api_test.go</text><text x="80" y="433" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">validation.go</text><text x="80" y="479" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">ui.go</text><text x="80" y="590" fill="#34d399" font-size="27" font-family="Noto Sans, sans-serif">Agent proposes the split.</text><text x="80" y="645" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">You inspect the boundaries.</text><text x="80" y="690" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">Keep tests with their code.</text><text x="80" y="735" fill="#e4e4e7" font-size="25" font-family="Noto Sans, sans-serif">Order dependencies first.</text><rect x="530" y="125" width="560" height="675" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="555" y="175" fill="#818cf8" font-size="29" font-family="Noto Sans, sans-serif">2. Inspect the JSON plan</text><text x="550" y="225" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">{</text><text x="550" y="257" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">  &quot;branch&quot;: &quot;feature/orders&quot;,</text><text x="550" y="289" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">  &quot;head&quot;: &quot;1ebeb53660dd&quot;,</text><text x="550" y="321" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">  &quot;slices&quot;: [</text><text x="550" y="353" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">    {&quot;name&quot;: &quot;feature/api&quot;,</text><text x="550" y="385" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">     &quot;message&quot;: &quot;Add order API&quot;,</text><text x="550" y="417" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">     &quot;paths&quot;: [&quot;api.go&quot;,</text><text x="550" y="449" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">               &quot;api_test.go&quot;]},</text><text x="550" y="481" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">    {&quot;name&quot;: &quot;feature/validation&quot;,</text><text x="550" y="513" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">     &quot;message&quot;: &quot;Validate quantities&quot;,</text><text x="550" y="545" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">     &quot;paths&quot;: [&quot;validation.go&quot;]},</text><text x="550" y="577" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">    {&quot;name&quot;: &quot;feature/orders&quot;,</text><text x="550" y="609" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">     &quot;message&quot;: &quot;Add order UI&quot;,</text><text x="550" y="641" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">     &quot;rest&quot;: true}</text><text x="550" y="673" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">  ]</text><text x="550" y="705" fill="#e4e4e7" font-size="23" font-family="Fira Code, monospace">}</text><rect x="1120" y="125" width="425" height="675" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="1140" y="175" fill="#818cf8" font-size="29" font-family="Noto Sans, sans-serif">3. Preview + verify</text><text x="1140" y="230" fill="#818cf8" font-size="23" font-family="Fira Code, monospace">st split apply plan.json</text><text x="1140" y="265" fill="#818cf8" font-size="23" font-family="Fira Code, monospace">  --dry-run</text><text x="1140" y="325" fill="#e4e4e7" font-size="24" font-family="Noto Sans, sans-serif">Nothing was changed.</text><text x="1140" y="410" fill="#818cf8" font-size="23" font-family="Fira Code, monospace">st split apply plan.json</text><text x="1140" y="445" fill="#818cf8" font-size="23" font-family="Fira Code, monospace">  --exec &quot;go test ./...&quot;</text><text x="1140" y="530" fill="#34d399" font-size="23" font-family="Noto Sans, sans-serif">API → validation → UI</text><text x="1140" y="582" fill="#34d399" font-size="23" font-family="Noto Sans, sans-serif">UI keeps feature/orders</text><text x="1140" y="634" fill="#34d399" font-size="23" font-family="Noto Sans, sans-serif">Tests pass in every slice</text><text x="1140" y="686" fill="#34d399" font-size="23" font-family="Noto Sans, sans-serif">Top content unchanged</text><text x="55" y="860" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">Commands and plan captured from a real split. Detailed output is in the evidence bundle.</text></svg>
