<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0a0f"/><text x="60" y="75" fill="#e4e4e7" font-size="43" font-family="Noto Sans, sans-serif">Fix the lower branch. Restack the work above.</text><rect x="60" y="145" width="650" height="630" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="85" y="188" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">Navigate down; edit api.go; amend</text><text x="85" y="239" fill="#818cf8" font-size="25" font-family="Fira Code, monospace">$ st down</text><text x="85" y="279" fill="#e4e4e7" font-size="25" font-family="Fira Code, monospace">✔ Checked out &#x27;feature/validation&#x27;</text><text x="85" y="339" fill="#818cf8" font-size="25" font-family="Fira Code, monospace">$ st down</text><text x="85" y="379" fill="#e4e4e7" font-size="25" font-family="Fira Code, monospace">✔ Checked out &#x27;feature/api&#x27;</text><text x="85" y="439" fill="#818cf8" font-size="25" font-family="Fira Code, monospace">$ st modify --all</text><text x="85" y="479" fill="#e4e4e7" font-size="25" font-family="Fira Code, monospace">✔ Modified &#x27;feature/api&#x27; and restacked</text><text x="85" y="519" fill="#e4e4e7" font-size="25" font-family="Fira Code, monospace">3 downstream branches</text><rect x="750" y="145" width="790" height="630" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="775" y="188" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">Updated stack • original checkout restored</text><text x="775" y="239" fill="#818cf8" font-size="26" font-family="Fira Code, monospace">$ st log</text><text x="775" y="282" fill="#e4e4e7" font-size="26" font-family="Fira Code, monospace">Stack:</text><text x="775" y="325" fill="#e4e4e7" font-size="26" font-family="Fira Code, monospace">○ main</text><text x="775" y="368" fill="#e4e4e7" font-size="26" font-family="Fira Code, monospace">  ● feature/api</text><text x="775" y="411" fill="#e4e4e7" font-size="26" font-family="Fira Code, monospace">    ○ feature/validation</text><text x="775" y="454" fill="#e4e4e7" font-size="26" font-family="Fira Code, monospace">      ○ feature/ui</text><text x="775" y="518" fill="#818cf8" font-size="26" font-family="Fira Code, monospace">$ git branch --show-current</text><text x="775" y="561" fill="#e4e4e7" font-size="26" font-family="Fira Code, monospace">feature/api</text><text x="60" y="850" fill="#818cf8" font-size="30" font-family="Noto Sans, sans-serif">New commit instead? git commit → st top → st restack</text></svg>
