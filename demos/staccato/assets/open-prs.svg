<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0a0f"/><text x="60" y="75" fill="#e4e4e7" font-size="43" font-family="Noto Sans, sans-serif">Publish the stack; review each slice.</text><rect x="60" y="135" width="880" height="440" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="85" y="178" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">Actual output • local bare origin</text><text x="85" y="229" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ st sync --down</text><text x="85" y="258" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">Fetching from remote...</text><text x="85" y="287" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">No merged branches detected.</text><text x="85" y="316" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace"></text><text x="85" y="345" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">✔ Sync complete: 0 merged, 3 restacked, 0 pushed</text><text x="85" y="388" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ st sync</text><text x="85" y="417" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">Fetching from remote...</text><text x="85" y="446" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">No merged branches detected.</text><text x="85" y="475" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace"></text><text x="85" y="504" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">✔ Sync complete: 0 merged, 3 restacked, 3 pushed</text><rect x="60" y="600" width="880" height="245" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="85" y="643" fill="#fcd34d" font-size="28" font-family="Noto Sans, sans-serif">GitHub commands • not executed</text><text x="85" y="690" fill="#e4e4e7" font-size="24" font-family="Fira Code, monospace">git checkout feature/api</text><text x="85" y="730" fill="#e4e4e7" font-size="24" font-family="Fira Code, monospace">st pr make --title &quot;Add order API&quot; \</text><text x="85" y="770" fill="#e4e4e7" font-size="24" font-family="Fira Code, monospace">  --description &quot;Adds the order API.&quot;</text><text x="85" y="810" fill="#e4e4e7" font-size="24" font-family="Fira Code, monospace">Repeat for validation and UI, bottom-up.</text><rect x="990" y="180" width="550" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="1015" y="225" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">API → trunk</text><text x="1015" y="264" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">feature/api → main</text><rect x="990" y="350" width="550" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="1015" y="395" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">Validation → API</text><text x="1015" y="434" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">feature/validation → feature/api</text><rect x="990" y="520" width="550" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="1015" y="565" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">UI → validation</text><text x="1015" y="604" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">feature/ui → feature/validation</text><text x="990" y="765" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">Requires origin + authenticated gh</text></svg>
