<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0a0a0f"/><text x="60" y="75" fill="#e4e4e7" font-size="43" font-family="Noto Sans, sans-serif">Create a branch for each reviewable change.</text><rect x="60" y="145" width="470" height="470" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="85" y="188" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">1. API • edit code, then commit</text><text x="85" y="239" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ st new feature/api</text><text x="85" y="270" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">✔ Created branch &#x27;feature/api&#x27;</text><text x="85" y="301" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">on top of &#x27;main&#x27;</text><text x="85" y="347" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ git add . &amp;&amp; git commit -m</text><text x="85" y="378" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">&quot;Add order API&quot;</text><text x="85" y="409" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">[feature/api 90cc9fb] Add</text><text x="85" y="440" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">order API</text><rect x="565" y="145" width="470" height="470" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="590" y="188" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">2. Validation • same pattern</text><text x="590" y="239" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ st append feature/validation</text><text x="590" y="270" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">✔ Created branch</text><text x="590" y="301" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">&#x27;feature/validation&#x27; on top of</text><text x="590" y="332" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">&#x27;feature/api&#x27;</text><text x="590" y="378" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ git add . &amp;&amp; git commit -m</text><text x="590" y="409" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">&quot;Validate order quantities&quot;</text><text x="590" y="440" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">[feature/validation 9c5a3b9]</text><text x="590" y="471" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">Validate order quantities</text><rect x="1070" y="145" width="470" height="470" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="1095" y="188" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">3. UI • same pattern</text><text x="1095" y="239" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ st append feature/ui</text><text x="1095" y="270" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">✔ Created branch &#x27;feature/ui&#x27;</text><text x="1095" y="301" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">on top of &#x27;feature/validation&#x27;</text><text x="1095" y="347" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">$ git add . &amp;&amp; git commit -m</text><text x="1095" y="378" fill="#818cf8" font-size="22" font-family="Fira Code, monospace">&quot;Add order UI&quot;</text><text x="1095" y="409" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">[feature/ui 14566c5] Add order</text><text x="1095" y="440" fill="#e4e4e7" font-size="22" font-family="Fira Code, monospace">UI</text><text x="60" y="675" fill="#818cf8" font-size="30" font-family="Fira Code, monospace">st log: the resulting parent chain</text><rect x="60" y="710" width="300" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="85" y="755" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">Trunk</text><text x="85" y="794" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">main</text><rect x="415" y="710" width="300" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="440" y="755" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">API</text><text x="440" y="794" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">feature/api</text><rect x="770" y="710" width="370" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="795" y="755" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">Validation</text><text x="795" y="794" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">feature/validation</text><rect x="1195" y="710" width="345" height="115" rx="22" fill="#18181b" stroke="#3f3f46"/><text x="1220" y="755" fill="#818cf8" font-size="32" font-family="Noto Sans, sans-serif">UI • current</text><text x="1220" y="794" fill="#a1a1aa" font-size="25" font-family="Noto Sans, sans-serif">feature/ui</text><text x="365" y="780" fill="#818cf8" font-size="36" font-family="Noto Sans, sans-serif">→</text><text x="725" y="780" fill="#818cf8" font-size="36" font-family="Noto Sans, sans-serif">→</text><text x="1145" y="780" fill="#818cf8" font-size="36" font-family="Noto Sans, sans-serif">→</text><text x="60" y="875" fill="#a1a1aa" font-size="24" font-family="Noto Sans, sans-serif">Actual CLI output; Git commit output excerpted. Code edits happen between commands.</text></svg>
